# NOT READ BY NETLIFY. The site's base directory is frontend/, and a
# netlify.toml there takes precedence — the build log reports
# "Config file /opt/build/repo/frontend/netlify.toml". Edit
# frontend/netlify.toml instead. Rules added only here (like /p/* below, until
# it was copied over) silently never take effect.
[build]
  base = "frontend"
  command = "npm ci && npm run build"
  publish = "dist"

# Shareable product pages are server-rendered by the backend so link previews
# get real per-product OG tags — the SPA fallback below can only ever serve one
# generic card. Must stay ABOVE the /* catch-all: Netlify takes the first match.
[[redirects]]
  from = "/p/*"
  to = "https://nc-website-4.onrender.com/p/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/admin/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Optional: proxy API calls to your backend (uncomment and set your backend URL)
# [[redirects]]
#   from = "/api/*"
#   to = "https://YOUR-BACKEND-HOSTNAME/api/:splat"
#   status = 200
#   force = true
