# Keeps the API awake.
#
# Render suspends a free-tier service after 15 minutes with no traffic, and
# waking it takes the better part of a minute — during which the shop has no
# products and a visitor sees an empty store. Any request resets that timer, so
# this pings the health endpoint every ten minutes.
#
# Two things to know about relying on this:
#
#   * GitHub does not promise punctual cron. Scheduled runs are queued at
#     best effort and can slip by several minutes when the runners are busy,
#     so an occasional sleep still gets through.
#   * GitHub disables scheduled workflows in a repository with no commits for
#     60 days. If the shop goes quiet for two months, this stops silently and
#     has to be re-enabled from the Actions tab.
#
# The reliable fix is a paid Render instance, which never spins down at all.
# This is the free-tier stopgap.

name: Keep the shop warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

# A single ping at a time; a backlog of queued runs helps nobody.
concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Ping the API until it answers
        env:
          # Override in Settings → Secrets and variables → Actions → Variables
          # if the service ever moves.
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://nc-website-4.onrender.com' }}
        run: |
          set -u
          for attempt in 1 2 3; do
            # A cold start can hold the request open for most of a minute, so
            # give it room rather than timing out and calling that a failure.
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 90 \
              "$BACKEND_URL/api/health" || echo "000")
            echo "attempt $attempt -> HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Shop is awake."
              exit 0
            fi
            sleep 20
          done
          echo "::error::$BACKEND_URL/api/health did not return 200 after three attempts."
          exit 1
