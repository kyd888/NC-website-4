[build]
  command = "npm ci && npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(self)"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # connect.facebook.net serves the Meta Pixel (fbevents.js and its per-dataset
    # config). Its event beacons go to facebook.com and are already covered by
    # img-src/connect-src https:.
    # static.cloudflareinsights.com serves Cloudflare Web Analytics, which
    # Cloudflare injects into every page at its edge; its beacon posts to
    # cloudflareinsights.com, also covered by connect-src https:.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' js.stripe.com https://connect.facebook.net https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: res.cloudinary.com; connect-src 'self' https: wss:; frame-src js.stripe.com; font-src 'self' data:; object-src 'none'; base-uri 'self'"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

# Shareable product pages (/p/<id>) are server-rendered by the backend, so link
# previews carry the product's own title, price and availability — the SPA can
# only ever serve one generic card. Must stay ABOVE the /* catch-all: Netlify
# takes the first matching rule.
#
# This is the config Netlify actually reads (the base directory is frontend/).
# The rule previously lived only in the repo-root netlify.toml, which Netlify
# ignores, so /p/ links fell through to the SPA's ProductLinkFallback instead.
[[redirects]]
  from = "/p/*"
  to = "https://nc-website-4.onrender.com/p/:splat"
  status = 200
  force = true

# Product catalog feed that Meta Commerce Manager re-fetches on a schedule. The
# backend builds it from the live catalog and stock; proxied so the feed URL
# stays on the site's own domain. Also above the /* catch-all.
[[redirects]]
  from = "/feeds/*"
  to = "https://nc-website-4.onrender.com/feeds/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
