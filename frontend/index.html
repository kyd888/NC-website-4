
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the page paint under the iPhone home indicator.
         Without it, in-app browsers like Instagram leave that 34pt strip to the
         webview, which paints it white below the off-white page. Every bottom-
         anchored element pads by env(safe-area-inset-bottom) to stay clear. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>NO CONNECTION</title>
    <meta name="description" content="Limited drops. No restocks. Shop NC." />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://no-connection.com/" />
    <meta property="og:title" content="NO CONNECTION" />
    <meta property="og:description" content="Limited drops. No restocks. Shop NC." />
    <meta property="og:image" content="https://no-connection.com/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="NC" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://no-connection.com/" />
    <meta name="twitter:title" content="NO CONNECTION" />
    <meta name="twitter:description" content="Limited drops. No restocks. Shop NC." />
    <meta name="twitter:image" content="https://no-connection.com/og-card.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
